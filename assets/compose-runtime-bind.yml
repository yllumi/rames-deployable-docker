# Rames: tanpa Dockerfile — runtime resmi + source repo di-bind.
# Cocok untuk app kecil. Untuk produksi yang butuh build asset, gunakan Dockerfile.
services:
  app:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    # Butuh package-lock.json (npm ci). Bila tidak ada, ganti dengan `npm install`.
    command: ["sh", "-c", "npm ci --omit=dev && node server.js"]
    ports:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      APP_URL: ${APP_URL}
    volumes:
      # Source repo. Jangan mengandalkan node_modules dari host.
      - ./:/app
      - node-modules:/app/node_modules
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  node-modules:
