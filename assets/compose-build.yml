# Rames: Dockerfile + compose. `build:` hanya untuk app Git/Compose milik user,
# BUKAN untuk template (mode template menolak build).
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000"
    environment:
      APP_ENV: production
      APP_URL: ${APP_URL}
    volumes:
      - app-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  app-data:
